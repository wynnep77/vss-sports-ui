version: '3.8'

services:
  vss-sports-ui:
    build: .
    container_name: vss-sports-ui
    ports:
      - "8080:80"
    environment:
      - VITE_VSS_API_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - vss-network

networks:
  vss-network:
    driver: bridge
